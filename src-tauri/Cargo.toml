[package]
name = "fred-again-music-game"
version = "0.1.0"
description = "A music creation game inspired by Fred again's stem-based production style"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.5", features = ["shell-open", "fs-all"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "sqlite"] }
chrono = "0.4"
uuid = { version = "1.0", features = ["v4", "serde"] }
log = "0.4"
env_logger = "0.10"

[[bin]]
name = "fred-again-music-game"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
